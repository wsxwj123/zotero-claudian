<groupbox
  id="__addonRef__-prefs"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 id="__addonRef__-prefs-title"></html:h2></label>
  <description id="__addonRef__-prefs-intro"></description>

  <hbox align="center">
    <label
      id="__addonRef__-pref-workspace-label"
      control="__addonRef__-pref-workspace"
    ></label>
    <html:input
      type="text"
      id="__addonRef__-pref-workspace"
      class="directory-path"
      preference="__prefsPrefix__.workspacePath"
      flex="1"
      aria-labelledby="__addonRef__-pref-workspace-label"
    ></html:input>
    <button id="__addonRef__-pref-workspace-browse"></button>
  </hbox>
  <description id="__addonRef__-pref-workspace-hint"></description>

  <!-- R6：工作区模式（单一目录 / 按合集分目录） -->
  <hbox align="center">
    <label
      id="__addonRef__-pref-ws-mode-label"
      control="__addonRef__-pref-ws-mode"
    ></label>
    <menulist
      id="__addonRef__-pref-ws-mode"
      preference="__prefsPrefix__.workspaceMode"
      native="true"
      aria-labelledby="__addonRef__-pref-ws-mode-label"
    >
      <menupopup>
        <menuitem
          id="__addonRef__-pref-ws-mode-single"
          value="single"
        ></menuitem>
        <menuitem
          id="__addonRef__-pref-ws-mode-collection"
          value="collection"
        ></menuitem>
      </menupopup>
    </menulist>
  </hbox>
  <description id="__addonRef__-pref-ws-mode-hint"></description>

  <hbox align="center">
    <label
      id="__addonRef__-pref-mode-label"
      control="__addonRef__-pref-mode"
    ></label>
    <menulist
      id="__addonRef__-pref-mode"
      preference="__prefsPrefix__.defaultPermissionMode"
      native="true"
      aria-labelledby="__addonRef__-pref-mode-label"
    >
      <menupopup>
        <menuitem
          id="__addonRef__-pref-mode-default"
          value="default"
        ></menuitem>
        <menuitem
          id="__addonRef__-pref-mode-acceptEdits"
          value="acceptEdits"
        ></menuitem>
        <menuitem id="__addonRef__-pref-mode-plan" value="plan"></menuitem>
        <menuitem
          id="__addonRef__-pref-mode-bypass"
          value="bypass"
        ></menuitem>
      </menupopup>
    </menulist>
  </hbox>
  <description id="__addonRef__-pref-mode-hint"></description>
  <description id="__addonRef__-pref-mode-bypass-hint"></description>

  <hbox align="center">
    <checkbox
      id="__addonRef__-pref-auto-show"
      preference="__prefsPrefix__.autoShowPane"
    ></checkbox>
  </hbox>
  <description id="__addonRef__-pref-auto-show-hint"></description>

  <hbox align="center">
    <label
      id="__addonRef__-pref-cli-label"
      control="__addonRef__-pref-cli-path"
    ></label>
    <html:input
      type="text"
      id="__addonRef__-pref-cli-path"
      class="directory-path"
      preference="__prefsPrefix__.cliPathOverride"
      flex="1"
      aria-labelledby="__addonRef__-pref-cli-label"
    ></html:input>
  </hbox>
  <description id="__addonRef__-pref-cli-hint"></description>

  <!-- R4-3：用量 / 余额 -->
  <hbox align="center">
    <checkbox
      id="__addonRef__-pref-usage"
      preference="__prefsPrefix__.showUsage"
    ></checkbox>
  </hbox>
  <description id="__addonRef__-pref-usage-hint"></description>

  <hbox align="center">
    <label
      id="__addonRef__-pref-deepseek-label"
      control="__addonRef__-pref-deepseek"
    ></label>
    <html:input
      type="password"
      id="__addonRef__-pref-deepseek"
      preference="__prefsPrefix__.deepseekApiKey"
      autocomplete="off"
      flex="1"
      aria-labelledby="__addonRef__-pref-deepseek-label"
    ></html:input>
  </hbox>
  <description id="__addonRef__-pref-deepseek-hint"></description>
</groupbox>
